name: Build NEEDORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "needora-web-v2.zip"
      - ".github/workflows/build-needora-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Capacitor files
        run: |
          cat > package.json <<'EOF'
          {
            "name": "needora-mobile",
            "version": "3.0.1",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.2.1",
              "@capacitor/core": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.needora.app",
            "appName": "NEEDORA",
            "webDir": "www"
          }
          EOF

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          pip install pillow

      - name: Prepare web app
        run: |
          rm -rf www
          mkdir -p www
          unzip -q needora-web-v2.zip -d www
          test -f www/index.html
          test -f www/assets/icon-512.png

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Replace Android launcher icons
        run: |
          cat > /tmp/make_icons.py <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Image.open("www/assets/icon-512.png").convert("RGBA")
          res = Path("android/app/src/main/res")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.LANCZOS)
              icon.save(d / "ic_launcher.png")
              icon.save(d / "ic_launcher_round.png")

          drawable = res / "drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          src.resize((432, 432), Image.LANCZOS).save(drawable / "needora_launcher.png")

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "needora_icon_colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '  <color name="needora_icon_background">#102A43</color>\n'
              '</resources>\n',
              encoding="utf-8",
          )

          adaptive = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <background android:drawable="@color/needora_icon_background" />\n'
              '  <foreground android:drawable="@drawable/needora_launcher" />\n'
              '</adaptive-icon>\n'
          )

          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          (anydpi / "ic_launcher.xml").write_text(adaptive, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(adaptive, encoding="utf-8")
          PY
          python /tmp/make_icons.py

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NEEDORA-V3.apk
          test -f NEEDORA-V3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEEDORA-Android-APK-V3
          path: NEEDORA-V3.apk
          if-no-files-found: error
          retention-days: 14
          
