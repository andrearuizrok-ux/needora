name: Build NEEDORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "needora-web-v2.zip"
      - ".github/workflows/build-needora-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Capacitor project files
        run: |
          cat > package.json <<'EOF'
          {
            "name": "needora-mobile",
            "version": "2.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.2.1",
              "@capacitor/core": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.needora.app",
            "appName": "NEEDORA",
            "webDir": "www"
          }
          EOF

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          pip install pillow

      - name: Prepare NEEDORA web app
        run: |
          rm -rf www
          mkdir -p www
          unzip -q needora-web-v2.zip -d www
          test -f www/index.html
          test -f www/assets/icon-512.png

      - name: Create Android project
        run: npx cap add android

      - name: Sync NEEDORA to Android
        run: npx cap sync android

      - name: Generate Android launcher icon
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          img = Image.open('www/assets/icon-512.png').convert('RGBA')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          res = Path('android/app/src/main/res')
          for folder, size in sizes.items():
              d = res/folder
              d.mkdir(parents=True, exist_ok=True)
              out = img.resize((size,size), Image.LANCZOS)
              out.save(d/'ic_launcher.png')
              out.save(d/'ic_launcher_round.png')
          print('Launcher icons generated from NEEDORA icon')
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NEEDORA-debug.apk
          test -f NEEDORA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEEDORA-Android-APK
          path: NEEDORA-debug.apk
          if-no-files-found: error
          retention-days: 14
