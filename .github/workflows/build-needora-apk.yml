name: Build NEEDORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "needora-web-v2.zip"
      - ".github/workflows/build-needora-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Capacitor project files
        run: |
          cat > package.json <<'JSON'
          {
            "name": "needora-mobile",
            "version": "3.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.2.1",
              "@capacitor/core": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.needora.app",
            "appName": "NEEDORA",
            "webDir": "www"
          }
          JSON

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          pip install pillow numpy

      - name: Prepare NEEDORA web app
        run: |
          rm -rf www
          mkdir -p www
          unzip -q needora-web-v2.zip -d www
          test -f www/index.html
          test -f www/assets/icon-512.png

      - name: Create Android project
        run: npx cap add android

      - name: Sync NEEDORA to Android
        run: npx cap sync android

      - name: Replace all Android launcher icons
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import numpy as np

          src = Image.open('www/assets/icon-512.png').convert('RGBA')
          arr = np.array(src.convert('RGB'))
          mask = np.min(arr, axis=2) < 235
          ys, xs = np.where(mask)
          if len(xs):
              l, t, r, b = xs.min(), ys.min(), xs.max()+1, ys.max()+1
              w, h = r-l, b-t
              side = max(w, h)
              cx, cy = (l+r)//2, (t+b)//2
              l = max(0, cx-side//2)
              t = max(0, cy-side//2)
              r = min(src.width, l+side)
              b = min(src.height, t+side)
              src = src.crop((l,t,r,b))

          res = Path('android/app/src/main/res')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.LANCZOS)
              icon.save(d / 'ic_launcher.png')
              icon.save(d / 'ic_launcher_round.png')

          dd = res / 'drawable-nodpi'
          dd.mkdir(parents=True, exist_ok=True)
          src.resize((512,512), Image.LANCZOS).save(dd / 'needora_launcher.png')

          values = res / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values / 'needora_icon_colors.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="needora_icon_background">#102A43</color>\n</resources>\n',
              encoding='utf-8'
          )

          anydpi = res / 'mipmap-anydpi-v26'
          anydpi.mkdir(parents=True, exist_ok=True)
          xml = '''<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/needora_icon_background" />
    <foreground android:drawable="@drawable/needora_launcher" />
</adaptive-icon>
'''
          (anydpi / 'ic_launcher.xml').write_text(xml, encoding='utf-8')
          (anydpi / 'ic_launcher_round.xml').write_text(xml, encoding='utf-8')
          print('NEEDORA legacy and adaptive launcher icons replaced')
          PY

      - name: Force app version update
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('versionCode 1', 'versionCode 3')
          s = s.replace('versionName "1.0"', 'versionName "3.0"')
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NEEDORA-V3.apk
          test -f NEEDORA-V3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEEDORA-Android-APK-V3
          path: NEEDORA-V3.apk
          if-no-files-found: error
          retention-days: 14
          
